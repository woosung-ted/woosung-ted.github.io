<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SnakeByte — Old retro funny game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="--purple:#7c1dfd">
  <header class="topbar">
    <a class="logo" href="#top">SNAKEBYTE</a>
    <nav aria-label="Main navigation"><a href="#profile">PROFILE</a><a href="#project">PROJECT</a><a href="#game-section">GAME</a><a href="#contact">CONTACT</a></nav>
  </header>

  <main id="top">
    <section class="hero" id="profile">
      <p class="eyebrow">PROFILE</p>
      <h1>Ted the engineer</h1>
      <p>삼성전자 무선 사업부</p>
    </section>

    <section class="panel intro" id="project">
      <div><p class="eyebrow">PROJECT</p><h2>Project</h2><p><a href="#game-section">SnakeByte</a></p></div>
      <div><p class="eyebrow">BUILT WITH</p><p class="stack">HTML5<br>CSS<br>JAVASCRIPT</p></div>
    </section>

    <section id="game-section" class="game-section">
      <div class="section-heading"><div><p class="eyebrow">GAME</p><h2>SnakeByte</h2></div><button id="sound-toggle" class="button secondary" type="button" aria-pressed="false">SOUND: ON</button></div>
      <div class="game-shell panel">
        <div class="hud"><span>SCORE <b id="score">0</b></span><span>COINS <b id="coins">0</b></span><span>LEVEL <b id="level">1</b></span><span>HI <b id="high-score">0</b></span></div>
        <canvas id="game" width="360" height="360" aria-label="SnakeByte game board"></canvas>
        <div class="game-actions"><button id="start" class="button" type="button">START</button><button id="pause" class="button secondary" type="button" disabled>PAUSE</button><button id="use-coin" class="button secondary" type="button">USE COIN</button><label>MODE <select id="mode"><option value="free">FREESTYLE</option><option value="level">LEVEL</option></select></label></div>
        <div class="dpad" aria-label="Touch controls"><button data-dir="up">▲</button><div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div>
        <p id="status" class="status">Arrow keys / WASD / swipe to move.</p>
      </div>
    </section>

    <section class="hero contact" id="contact">
      <p class="eyebrow">CONTACT</p>
      <h2><a href="https://woosung-ted.github.io">https://woosung-ted.github.io</a></h2>
    </section>
  </main>
  <footer>© 2026 SnakeByte · <a href="https://github.com/woosung-ted/woosung-ted.github.io" target="_blank" rel="noreferrer">SOURCE ON GITHUB</a></footer>
  <script src="app.js"></script>
</body>
</html>
